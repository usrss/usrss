<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="Bradi Carcasona, backend developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d0b"/><stop offset="1" stop-color="#0c1f16"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#d7ffe0"/><stop offset=".5" stop-color="#3fb950"/><stop offset="1" stop-color="#39d0d8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1200" height="700"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#3fb950" stroke-opacity=".07"/></pattern>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset=".5" stop-color="#3fb950" stop-opacity=".16"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect width="800" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .blob { animation: drift 12s ease-in-out infinite alternate; }
    .b2 { animation-duration: 15s; animation-direction: alternate-reverse; }
    .b3 { animation-duration: 18s; }
    .f { font-size:14px; fill:#4ade80; opacity:0; animation: float var(--d) linear infinite; }
    .name { font-size:56px; font-weight:700; fill:url(#g); opacity:0; animation: rise 1s .3s ease forwards; }
    .arrow { font-size:22px; fill:#3fb950; font-weight:700; }
    .role { font-size:22px; fill:#e6edf3; opacity:0; animation: cycle 12s ease infinite; }
    .loc { font-size:14px; fill:#8d96a0; opacity:0; animation: rise 1s .9s ease forwards; }
    .title { font-size:12px; fill:#6e7681; }
    .ring { fill:none; stroke:#3fb950; stroke-width:2; transform-box:fill-box; transform-origin:center; animation: ping 1.8s ease-out infinite; }
    .pill { opacity:0; animation: rise 1s 1.2s ease forwards; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform:translateY(0); } to { transform:translateY(340px); } }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes cycle { 0% { opacity:0; transform:translateY(10px); } 5% { opacity:1; transform:translateY(0); } 22% { opacity:1; transform:translateY(0); } 27% { opacity:0; transform:translateY(-10px); } 100% { opacity:0; } }
    @keyframes float { 0% { transform:translateY(0); opacity:0; } 15% { opacity:.32; } 85% { opacity:.32; } 100% { transform:translateY(-300px); opacity:0; } }
    @keyframes drift { from { transform:translate(0,0); } to { transform:translate(90px,40px); } }
    @keyframes ping { 0% { transform:scale(1); opacity:.9; } 100% { transform:scale(3); opacity:0; } }
  </style>
  <rect width="800" height="280" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect width="800" height="280" fill="url(#grid)"/>
    <g filter="url(#blur)" opacity=".38">
      <circle class="blob" cx="140" cy="60" r="90" fill="#00e676"/>
      <circle class="blob b2" cx="620" cy="90" r="100" fill="#0b8a6a"/>
      <circle class="blob b3" cx="440" cy="250" r="80" fill="#1f6feb"/>
    </g>
  <text class="f" x="500" y="285" style="--d:9s;animation-delay:0s">{ }</text>
  <text class="f" x="560" y="285" style="--d:10s;animation-delay:-5s">&lt;/&gt;</text>
  <text class="f" x="620" y="285" style="--d:11s;animation-delay:-10s">SELECT</text>
  <text class="f" x="680" y="285" style="--d:12s;animation-delay:-3s">def</text>
  <text class="f" x="700" y="285" style="--d:13s;animation-delay:-7s">git push</text>
  <text class="f" x="530" y="285" style="--d:14s;animation-delay:-11s">200 OK</text>
  <text class="f" x="590" y="285" style="--d:9s;animation-delay:-3s">pip</text>
  <text class="f" x="650" y="285" style="--d:10s;animation-delay:-5s">&lt;div&gt;</text>
  <text class="f" x="710" y="285" style="--d:11s;animation-delay:-7s">JOIN</text>
  <text class="f" x="760" y="285" style="--d:12s;animation-delay:-9s">=&gt;</text>
  <text class="f" x="480" y="285" style="--d:13s;animation-delay:-11s">::</text>
  <text class="f" x="610" y="285" style="--d:14s;animation-delay:-13s">0x1F</text>
  <text class="f" x="700" y="285" style="--d:9s;animation-delay:-6s">async</text>
  <text class="f" x="570" y="285" style="--d:10s;animation-delay:-5s">INSERT</text>
    <rect class="scan" y="-60" width="800" height="60" fill="url(#scanG)"/>
  </g>
  <rect width="800" height="280" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <circle cx="28" cy="26" r="6" fill="#ff5f56"/><circle cx="48" cy="26" r="6" fill="#ffbd2e"/><circle cx="68" cy="26" r="6" fill="#27c93f"/>
  <text class="title" x="92" y="30">bradi@clinic: ~/profile</text>
  <text class="name" x="42" y="122">Bradi Carcasona</text>
  <text class="arrow" x="42" y="172">&gt;</text>
  <text class="arrow" x="42" y="172">&gt;</text>
<text class="role" x="66" y="172" style="animation-delay:0s">Web Developer</text>
<text class="role" x="66" y="172" style="animation-delay:3s">Python · Django · PostgreSQL</text>
<text class="role" x="66" y="172" style="animation-delay:6s">Turning ideas into working software</text>
<text class="role" x="66" y="172" style="animation-delay:9s">Building systems that solve real problems</text>
<text class="loc" x="42" y="206">Negros Oriental · Philippines</text>
  <g class="pill">
    <rect x="42" y="226" width="210" height="34" rx="17" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".5"/>
    <circle cx="64" cy="243" r="4" fill="#3fb950"/>
    <circle class="ring" cx="64" cy="243" r="4"/>
    <text x="78" y="248" font-size="13" fill="#7ee787">open to work</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
