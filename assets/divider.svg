<svg xmlns="http://www.w3.org/2000/svg" width="800" height="20" viewBox="0 0 800 20" role="presentation" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    :root { --line:#d0d7de; --accent:#0969da; }
    @media (prefers-color-scheme: dark) { :root { --line:#30363d; --accent:#58a6ff; } }
    .track { stroke:var(--line); stroke-width:1; }
    .dot   { fill:var(--accent); animation:slide 7s ease-in-out infinite alternate; }
    @keyframes slide { from { transform:translateX(40px); } to { transform:translateX(760px); } }
  </style>
  <line class="track" x1="40" y1="10" x2="760" y2="10"/>
  <circle class="dot" cx="0" cy="10" r="3"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
