<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40" role="presentation" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .core, .gh { fill:none; stroke-width:2; }
    .core { stroke:#3fb950; animation: idle 4s steps(1) infinite; }
    .gh1 { stroke:#39d0d8; opacity:0; animation: g1 4s steps(1) infinite; }
    .gh2 { stroke:#ffa657; opacity:0; animation: g2 4s steps(1) infinite; }
    .sa { animation: sa 4s steps(1) infinite; }
    .sb { animation: sb 4s steps(1) infinite; }
    .sc { animation: sc 4s steps(1) infinite; }
    .blk { fill:#7ee787; opacity:0; animation: blk 4s steps(1) infinite; }
    @keyframes idle { 0%,40%{opacity:1} 41%{opacity:.55} 42%,100%{opacity:1} }
    @keyframes g1 { 0%,86%{opacity:0;transform:translateX(0)} 87%{opacity:1;transform:translateX(-16px)} 89%{opacity:1;transform:translateX(12px)} 91%{opacity:.7;transform:translateX(-7px)} 93%{opacity:1;transform:translateX(20px)} 95%,100%{opacity:0} }
    @keyframes g2 { 0%,87%{opacity:0;transform:translateX(0)} 88%{opacity:1;transform:translateX(14px)} 90%{opacity:1;transform:translateX(-18px)} 92%{opacity:.8;transform:translateX(9px)} 94%{opacity:1;transform:translateX(-12px)} 96%,100%{opacity:0} }
    @keyframes sa { 0%,87%{transform:translate(0,0)} 88%{transform:translate(22px,-3px)} 90%{transform:translate(-10px,2px)} 92%{transform:translate(14px,0)} 94%,100%{transform:translate(0,0)} }
    @keyframes sb { 0%,88%{transform:translate(0,0)} 89%{transform:translate(-26px,3px)} 91%{transform:translate(12px,-2px)} 93%{transform:translate(-8px,0)} 95%,100%{transform:translate(0,0)} }
    @keyframes sc { 0%,87%{transform:translate(0,0)} 88%{transform:translate(10px,2px)} 90%{transform:translate(-20px,-3px)} 93%{transform:translate(16px,0)} 95%,100%{transform:translate(0,0)} }
    @keyframes blk { 0%,86%{opacity:0} 87%,89%{opacity:1} 90%,91%{opacity:0} 92%,94%{opacity:1} 95%,100%{opacity:0} }
  </style>
  <g class="core">
    <line class="sa" x1="40" y1="20" x2="300" y2="20"/>
    <line class="sb" x1="300" y1="20" x2="520" y2="20"/>
    <line class="sc" x1="520" y1="20" x2="760" y2="20"/>
  </g>
  <line class="gh gh1" x1="40" y1="17" x2="760" y2="17"/>
  <line class="gh gh2" x1="40" y1="23" x2="760" y2="23"/>
  <rect class="blk" x="140" y="9" width="26" height="4"/>
  <rect class="blk" x="410" y="27" width="40" height="3" style="animation-delay:.04s"/>
  <rect class="blk" x="620" y="10" width="18" height="5"/>
  <rect class="blk" x="260" y="26" width="12" height="4" style="animation-delay:.08s"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
