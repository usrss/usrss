<svg xmlns="http://www.w3.org/2000/svg" width="800" height="90" viewBox="0 0 800 90" role="img" aria-label="Thanks for stopping by" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#d7ffe0"/><stop offset=".5" stop-color="#3fb950"/><stop offset="1" stop-color="#39d0d8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .t { font-size:18px; fill:url(#g); font-weight:600; }
    .x { font-size:15px; fill:#8d96a0; }
    .cursor { fill:#3fb950; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  </style>
  <text class="t" x="400" y="34" text-anchor="middle">thanks for stopping by</text>
  <text class="x" x="400" y="66" text-anchor="middle">$ exit 0</text>
  <rect class="cursor" x="443" y="53" width="9" height="16"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
